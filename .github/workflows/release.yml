name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go-service/go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install PDF tools (Windows)
        if: matrix.target.name == 'windows'
        run: choco install qpdf ghostscript -y --no-progress

      - name: Stage bundled tools for Windows
        if: matrix.target.name == 'windows'
        run: |
          mkdir -p apps/desktop/src-tauri/resources/bin
           
          # Find and copy qpdf
          $qpdf = (Get-Command qpdf.exe -ErrorAction SilentlyContinue).Source
          if (-not $qpdf) {
            $qpdf = "C:\Program Files\qpdf\bin\qpdf.exe"
          }
          if (Test-Path $qpdf) {
            Copy-Item $qpdf apps/desktop/src-tauri/resources/bin/
            Write-Host "Copied qpdf: $qpdf"
          } else {
            throw "qpdf.exe not found"
          }
           
          # Find and copy Ghostscript
          $gs = (Get-ChildItem "C:\Program Files\gs" -Recurse -Filter gswin64c.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($gs) {
            Copy-Item $gs apps/desktop/src-tauri/resources/bin/
            Write-Host "Copied Ghostscript: $gs"
             
            # Also copy Ghostscript DLLs from same directory
            $gsDir = Split-Path $gs
            Get-ChildItem "$gsDir\*.dll" | ForEach-Object {
              Copy-Item $_.FullName apps/desktop/src-tauri/resources/bin/
              Write-Host "Copied DLL: $($_.Name)"
            }
          } else {
            throw "gswin64c.exe not found"
          }

      - name: Install PDF tools (macOS)
        if: matrix.target.name == 'macos'
        run: brew install qpdf ghostscript

      - name: Stage bundled tools for macOS
        if: matrix.target.name == 'macos'
        run: |
          mkdir -p apps/desktop/src-tauri/resources/bin
          cp $(which qpdf) apps/desktop/src-tauri/resources/bin/ || true
          cp $(which gs) apps/desktop/src-tauri/resources/bin/ || true
        shell: bash

      - name: Build Go backend
        run: |
          cd backend/go-service
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o bin/pdfsvc.exe ./cmd/pdfsvc
          else
            go build -o bin/pdfsvc ./cmd/pdfsvc
          fi
        shell: bash

      - name: Stage binaries for bundling
        run: |
          mkdir -p apps/desktop/src-tauri/resources/bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp backend/go-service/bin/pdfsvc.exe apps/desktop/src-tauri/resources/bin/
          else
            cp backend/go-service/bin/pdfsvc apps/desktop/src-tauri/resources/bin/
          fi
        shell: bash

      - name: Install dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Build app bundle
        run: |
          cd apps/desktop
          npm run tauri:build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdftool-${{ matrix.target.name }}-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**

  publish:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
