name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go-service/go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install PDF tools
        run: choco install qpdf ghostscript -y --no-progress

      - name: Stage bundled tools
        run: |
          mkdir -p apps/desktop/src-tauri/resources/bin
          
          # Find and copy qpdf
          $qpdf = (Get-Command qpdf.exe -ErrorAction SilentlyContinue).Source
          if (-not $qpdf) {
            $qpdf = "C:\Program Files\qpdf\bin\qpdf.exe"
          }
          if (Test-Path $qpdf) {
            Copy-Item $qpdf apps/desktop/src-tauri/resources/bin/
            Write-Host "Copied qpdf: $qpdf"
          } else {
            throw "qpdf.exe not found"
          }
          
          # Find and copy Ghostscript
          $gs = (Get-ChildItem "C:\Program Files\gs" -Recurse -Filter gswin64c.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($gs) {
            Copy-Item $gs apps/desktop/src-tauri/resources/bin/
            Write-Host "Copied Ghostscript: $gs"
            
            # Also copy Ghostscript DLLs from same directory
            $gsDir = Split-Path $gs
            Get-ChildItem "$gsDir\*.dll" | ForEach-Object {
              Copy-Item $_.FullName apps/desktop/src-tauri/resources/bin/
              Write-Host "Copied DLL: $($_.Name)"
            }
          } else {
            throw "gswin64c.exe not found"
          }

      - name: Build Go backend
        run: |
          cd backend/go-service
          if (-not (Test-Path bin)) { mkdir bin }
          go build -o bin/pdfsvc.exe ./cmd/pdfsvc

      - name: Stage binaries for bundling
        run: |
          if (-not (Test-Path apps/desktop/src-tauri/resources/bin)) { mkdir apps/desktop/src-tauri/resources/bin }
          Copy-Item backend/go-service/bin/pdfsvc.exe apps/desktop/src-tauri/resources/bin/

      - name: Install deps
        run: |
          cd apps/desktop
          npm install

      - name: Build Windows installer
        run: |
          cd apps/desktop
          npm run tauri:build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: pdftool-windows-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**
