name: windows-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go-service/go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Go backend
        run: |
          cd backend/go-service
          if (-not (Test-Path bin)) { mkdir bin }
          go build -o bin/pdfsvc.exe ./cmd/pdfsvc

      - name: Install dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Build Windows installer
        run: |
          cd apps/desktop
          npm run tauri:build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: pdftool-windows-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**

